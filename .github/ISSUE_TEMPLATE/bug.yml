name: Bug report
description: Something in bruh does not work as the specification says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, personal names, host names, or private repository names. Replace them with placeholders such as `owner/repo`.
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: input
    id: bruh-version
    attributes:
      label: bruh version or commit
      description: The release tag, or the commit SHA for a development install.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Linux in a container
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Part
      description: The part where the problem occurs. For a role (bigm, clanker, clerk), report it at oter/coordinator.
      options:
        - implement skill
        - workflow (deliver)
        - workflow (tickets)
        - workflow (implement-tickets)
        - workflow (review-and-fix)
        - workflow (review-only)
        - lane.sh
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /bruh:deliver with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Give the section of docs/spec.md if you know it.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The result of the workflow and the relevant lines of `claude logs <id>`. Remove private data first.
      render: text
