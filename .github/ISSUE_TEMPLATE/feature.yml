name: Feature request
description: Propose a change to bruh.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem do you have? Give the evidence, for example a field run or a log.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What must change? A change of behavior also changes docs/spec.md.
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Specification section
      description: The section of docs/spec.md that the change touches, for example "4.1".
